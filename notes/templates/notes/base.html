
<!DOCTYPE html>
<html lang="en">
<head>
    {% load static %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Knowledge Vault{% endblock %} </title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="{% static 'notes/style.css' %}">

    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>

<body class="bg-slate-50 text-slate-900">

    <nav class="bg-white border-b border-slate-200 shadow-sm">
        <div class="max-w-7xl mx-auto px-6 py-4">

            <div class="flex items-center justify-between">

                <!-- Logo -->
                <a href="/" class="flex items-center gap-2">
                    <div class="bg-indigo-600 text-white p-2 rounded-lg">
                        <span class="font-bold text-xl">F</span>
                    </div>

                    <span class="text-2xl font-extrabold tracking-tight">
                        Knowledge_vault<span class="text-indigo-600">.</span>
                    </span>
                </a>

                <div class="flex items-center gap-8">

                    <a href="/"
                       class="text-indigo-600 font-semibold hover:text-indigo-700 transition">
                        Home
                    </a>

                    {% comment %} <a href="#about"
                       class="text-slate-600 font-medium hover:text-indigo-600 transition">
                        About
                    </a>

                    <a href="#projects"
                       class="text-slate-600 font-medium hover:text-indigo-600 transition">
                        Projects
                    </a>

                    <a href="#contact"
                       class="text-slate-600 font-medium hover:text-indigo-600 transition">
                        Contact
                    </a> {% endcomment %}

                </div>

                
                <a href="add-note"
                   class="bg-indigo-600 text-white px-5 py-2.5 rounded-lg font-semibold hover:bg-indigo-700 transition">
                    Add Note
                </a>

            </div>
        </div>
    </nav>
    <main>

    {% block content %}
    
    {% endblock %}
    </main>

</body>
</html>
